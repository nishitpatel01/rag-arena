[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-arena-backend"
version = "2.0.0"
description = "The RAG Arena: Progressive Enterprise RAG Benchmarking Platform on Google Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "google-genai>=1.0.0",
    "google-adk>=1.0.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-documentai>=2.25.0",
    "pymupdf>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
