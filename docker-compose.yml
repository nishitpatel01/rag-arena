# The RAG Arena v3 — one container (root Dockerfile): Starlette serves the built SPA + /api on :8080.
#   docker compose up --build        → replay mode (plays data/recordings; no credentials, no cloud calls)
#   open http://localhost:8080
# Live mode needs Google credentials inside the container; run the app locally instead (README Quickstart)
# or deploy to Cloud Run with scripts/deploy_cloudrun.sh.
services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEMO_MODE=replay
      - ALLOW_DEV_FIXTURES=0
      - REPLAY_SPEED=${REPLAY_SPEED:-1.0}
      - ENABLED_LEVELS=${ENABLED_LEVELS:-level1_naive,level2_hybrid,level3_multimodal,level4_agentic,managed_vertex}
    read_only: true
    tmpfs:
      - /tmp
